name: Auto-label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Only reads the label config from the base branch; PR code is never checked out.
      - uses: actions/labeler@v5
        with:
          sync-labels: true
