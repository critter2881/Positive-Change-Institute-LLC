name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const verified = pr.user.login === 'dependabot[bot]' &&
              pr.head.ref.startsWith('dependabot/') &&
              pr.head.repo.full_name === context.payload.repository.full_name &&
              pr.base.repo.full_name === context.payload.repository.full_name &&
              pr.state === 'open' &&
              !pr.labels.some(label => label.name === 'hold');
            core.setOutput('verified', String(verified));
            core.setOutput('url', pr.html_url);
      - id: meta
        if: steps.verify.outputs.verified == 'true'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Patch and minor updates merge automatically once required checks pass.
      # Major updates, and any PR labeled `hold`, are left for human review.
      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.verify.outputs.verified == 'true' &&
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.meta.outputs.update-type != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.verify.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
