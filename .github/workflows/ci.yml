name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: python -m flake8 backend/ tests/ auto_task_sync.py --max-line-length=100

  # ── Syntax check ─────────────────────────────────────────────────────
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile all Python files
        run: |
          find . -name '*.py' \
            -not -path './.git/*' \
            -not -path './.venv/*' \
            -exec python -m py_compile {} +

  # ── Backend tests ─────────────────────────────────────────────────────
  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint, syntax]
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            -v

  # ── Validate config JSON ───────────────────────────────────────────────
  validate-config:
    name: Validate config JSON
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for f in config/*.json; do
            echo "Validating $f ..."
            python -c "import json,sys; json.load(open('$f'))" \
              && echo "  OK" \
              || { echo "  FAILED"; exit 1; }
          done
