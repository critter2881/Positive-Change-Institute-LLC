name: Housekeeping (stale issues and PRs)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            This issue has had no activity for 60 days and will close in 14 days
            unless updated. Add the `pinned` label to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will close in 14 days
            unless updated. Add the `pinned` label to keep it open.
